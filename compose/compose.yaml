name: gamestream

x-kafka-env: &kafka-env
  CLUSTER_ID: JJ-tcULWCNebr0MdXYxiJg
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: ${GAMESTREAM_VOTERS:-1@broker1:9093}
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${GAMESTREAM_RF:-1}
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${GAMESTREAM_RF:-1}
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${GAMESTREAM_MIN_ISR:-1}
  KAFKA_MIN_INSYNC_REPLICAS: ${GAMESTREAM_MIN_ISR:-1}
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data

x-kafka: &kafka
  image: apache/kafka:3.9.1
  restart: unless-stopped
  environment: *kafka-env
  networks: [game]

services:
  broker1:
    <<: *kafka
    profiles: [small, full]
    hostname: broker1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:9092,EXTERNAL://127.0.0.1:19092
    ports: ["127.0.0.1:19092:9094"]
    volumes: [broker1_data:/var/lib/kafka/data]

  broker2:
    <<: *kafka
    profiles: [full]
    hostname: broker2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:9092,EXTERNAL://127.0.0.1:29092
    ports: ["127.0.0.1:29092:9094"]
    volumes: [broker2_data:/var/lib/kafka/data]

  broker3:
    <<: *kafka
    profiles: [full]
    hostname: broker3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker3:9092,EXTERNAL://127.0.0.1:39092
    ports: ["127.0.0.1:39092:9094"]
    volumes: [broker3_data:/var/lib/kafka/data]

  registry:
    image: apicurio/apicurio-registry:3.3.3
    profiles: [small, full]
    hostname: registry
    ports: ["127.0.0.1:18081:8080"]
    networks: [game]

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: [lakehouse]
    environment:
      MINIO_ROOT_USER: gamestream
      MINIO_ROOT_PASSWORD: local-demo-only
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: [minio_data:/bitnami/minio/data]
    networks: [game]

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    profiles: [lakehouse]
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'until mc alias set local http://minio:9000 gamestream local-demo-only; do sleep 2; done;
      mc mb --ignore-existing local/warehouse'
    depends_on: [minio]
    networks: [game]

  metastore-db:
    image: postgres:16-alpine
    profiles: [lakehouse]
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: metastore
    volumes: [metastore_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      retries: 20
    networks: [game]

  metastore:
    build:
      context: ./hive
    profiles: [lakehouse]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=local-demo-only
      HIVE_METASTORE_WAREHOUSE_DIR: s3a://warehouse/
      AWS_ACCESS_KEY_ID: gamestream
      AWS_SECRET_ACCESS_KEY: local-demo-only
    depends_on:
      metastore-db: {condition: service_healthy}
    ports: ["127.0.0.1:19083:9083"]
    networks: [game]

  airflow-db:
    image: postgres:16-alpine
    profiles: [lakehouse]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: airflow
    volumes: [airflow_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 20
    networks: [game]

  airflow-init:
    build:
      context: ..
      dockerfile: compose/airflow/Dockerfile
    profiles: [lakehouse]
    command: >-
      bash -c 'airflow db migrate && airflow users create
      --username admin --firstname Local --lastname Admin
      --role Admin --email admin@example.invalid --password local-demo-only || true'
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:local-demo-only@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: gamestream-local-demo-only
      GAMESTREAM_HOME: /opt/gamestream
      GAMESTREAM_HIVE_URI: thrift://metastore:9083
      GAMESTREAM_S3_ENDPOINT: http://minio:9000
      GAMESTREAM_BROKERS: broker1:9092
      GAMESTREAM_REGISTRY: http://registry:8080/apis/ccompat/v7
      GAMESTREAM_TRINO_HOST: trino
      GAMESTREAM_TRINO_PORT: "8080"
    depends_on:
      airflow-db: {condition: service_healthy}
    volumes: &airflow-volumes
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt:/opt/gamestream/dbt:ro
      - ../spark:/opt/gamestream/spark:ro
      - ../dq:/opt/gamestream/dq:ro
    networks: [game]

  airflow-webserver:
    build:
      context: ..
      dockerfile: compose/airflow/Dockerfile
    profiles: [lakehouse]
    command: webserver
    environment: *airflow-env
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    volumes: *airflow-volumes
    ports: ["127.0.0.1:18084:8080"]
    networks: [game]

  airflow-scheduler:
    build:
      context: ..
      dockerfile: compose/airflow/Dockerfile
    profiles: [lakehouse]
    command: scheduler
    environment: *airflow-env
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    volumes: *airflow-volumes
    networks: [game]

  spark-master:
    build:
      context: ..
      dockerfile: compose/spark/Dockerfile
    profiles: [lakehouse]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports: ["127.0.0.1:18080:8080"]
    networks: [game]

  spark-worker:
    build:
      context: ..
      dockerfile: compose/spark/Dockerfile
    profiles: [lakehouse]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on: [spark-master]
    networks: [game]

  trino:
    image: trinodb/trino:483
    profiles: [lakehouse]
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/node.properties:/etc/trino/node.properties:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    ports: ["127.0.0.1:18082:8080"]
    depends_on: [metastore, minio]
    networks: [game]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: [lakehouse]
    environment:
      CLICKHOUSE_DB: gamestream
      CLICKHOUSE_USER: gamestream
      CLICKHOUSE_PASSWORD: local-demo-only
    ports: ["127.0.0.1:18123:8123"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql:ro
    networks: [game]

  superset:
    build:
      context: ./superset
    profiles: [lakehouse]
    environment:
      SUPERSET_SECRET_KEY: gamestream-local-demo-only-change-me
    command: >-
      sh -c 'superset db upgrade &&
      (superset fab create-admin --username admin --firstname Local --lastname Admin
      --email admin@example.invalid --password local-demo-only || true) &&
      superset init && superset run -h 0.0.0.0 -p 8088'
    volumes: [superset_data:/app/superset_home]
    ports: ["127.0.0.1:18088:8088"]
    depends_on: [trino, clickhouse]
    networks: [game]

networks:
  game: {}

volumes:
  broker1_data: {}
  broker2_data: {}
  broker3_data: {}
  minio_data: {}
  metastore_data: {}
  clickhouse_data: {}
  airflow_db_data: {}
  superset_data: {}
