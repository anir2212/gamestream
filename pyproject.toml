[project]
name = "gamestream-producer"
version = "0.1.0"
description = "Synthetic game event producer for a local streaming lakehouse"
requires-python = ">=3.12,<3.14"
dependencies = ["confluent-kafka[avro]>=2.6,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.8,<1"]
spark = ["pyspark==3.5.7", "chispa>=0.11,<1"]
analytics = ["dbt-trino==1.9.3", "trino>=0.334,<1"]

[project.scripts]
gamestream-produce = "gamestream_producer.cli:main"
gamestream-fixture = "gamestream_producer.fixture:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["producer/gamestream_producer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Apache Spark 3.5.7's official image uses Python 3.8, which lacks datetime.UTC.
"spark/avro_decode.py" = ["UP017"]
